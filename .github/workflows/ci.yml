name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint, typecheck, unit tests, build; Deno worker tests; a migration-safety
# scanner; pgTAP against a real local Supabase stack.
jobs:
  frontend:
    name: Lint + unit tests + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint    # ESLint (hooks rules, TS recommended)
      - run: npm test        # vitest: the reporting maths (KPIs, rent roll, aging, CSV)
      - run: npm run build   # tsc -b && vite build
      - run: node scripts/check-code-map.mjs   # every "show me the code" target exists

  worker:
    name: Deno — worker tests + edge function type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - working-directory: worker
        run: deno test --allow-read
      # The edge functions resolve their own (jsr/npm) imports; keep Deno away
      # from the frontend's package.json / node_modules.
      - name: Type-check edge functions
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts

  migration-safety:
    name: Migration-safety scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-migrations.sh

  db-tests:
    name: pgTAP (RLS, ETL, z-score, isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0   # pinned: "latest" broke CI when [inbucket] became [local_smtp]
      # Provider secrets referenced by config.toml via env() — dummy values so
      # the local stack boots (OAuth isn't exercised by the tests).
      - name: Start local stack
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci
          SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID: ci
          SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET: ci
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta
      - name: Run pgTAP suite
        run: supabase test db
