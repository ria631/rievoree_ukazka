<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="X-RAY">
  <!-- Option 3 · Stencil X/. The current lime-tile X and slash, inverted to ink
       and cut with stencil bridges like the "MACHINERY" headline. -->
  <rect width="64" height="64" rx="14" fill="#0f2316"/>
  <g stroke="#A3E635" stroke-width="7.5" stroke-linecap="butt">
    <!-- "/" stroke of the X runs through; the "\" stroke is bridged at the crossing -->
    <line x1="35" y1="15" x2="13" y2="49"/>
    <line x1="13" y1="15" x2="20.2" y2="26.1"/>
    <line x1="27.8" y1="37.9" x2="35" y2="49"/>
  </g>
  <line x1="40.5" y1="49" x2="51" y2="15" stroke="#A3E635" stroke-width="5" stroke-linecap="butt"/>
</svg>
